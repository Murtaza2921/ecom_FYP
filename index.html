<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        .chat-container {
            width: 50%;
            margin: auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }

        .chat-box {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            background-color: #fff;
            text-align: left;
        }

        .user-message {
            font-weight: bold;
            color: #007bff;
            margin: 5px 0;
        }

        .bot-message {
            font-weight: bold;
            color: #28a745;
            margin: 5px 0;
        }

        .input-container {
            display: flex;
            margin-top: 10px;
        }

        .chat-input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        .send-btn {
            padding: 10px 15px;
            border: none;
            background-color: #007bff;
            color: white;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 5px;
        }

        .send-btn:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Product Chatbot</h1>
    <div class="chat-container">
        <div class="chat-box" id="chat-box">
            <!-- Chat messages will appear here -->
        </div>
        <div class="input-container">
            <input type="text" id="user-input" class="chat-input" placeholder="Ask about a product...">
            <button class="send-btn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            let userInput = document.getElementById("user-input").value;
            let chatBox = document.getElementById("chat-box");

            if (userInput.trim() === "") return;

            // Display user message
            let userMessage = `<p class="user-message">You: ${userInput}</p>`;
            chatBox.innerHTML += userMessage;

            // Simulating bot response (replace this with API call)
            fetch("http://127.0.0.1:8000/search/search", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({ query: userInput })
            })
            .then(response => response.json())
            .then(data => {
                let botMessage = `<p class="bot-message">Bot: ${data.message}</p>`;
                chatBox.innerHTML += botMessage;
                chatBox.scrollTop = chatBox.scrollHeight;
            })
            .catch(error => {
                let errorMessage = `<p class="bot-message">Bot: Sorry, I couldn't process your request.</p>`;
                chatBox.innerHTML += errorMessage;
            });

            document.getElementById("user-input").value = ""; // Clear input field
        }
    </script>

</body>
</html>
