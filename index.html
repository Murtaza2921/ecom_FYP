<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Product Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        #chat-box {
            width: 50%;
            height: 400px;
            border: 1px solid #ccc;
            overflow-y: auto;
            margin: auto;
            padding: 10px;
            background-color: #f9f9f9;
        }
        #user-input {
            width: 40%;
            padding: 10px;
        }
        button {
            padding: 10px;
            cursor: pointer;
        }
        .user-message {
            text-align: right;
            color: blue;
        }
        .bot-message {
            text-align: left;
            color: green;
        }
        .loading {
            font-style: italic;
            color: gray;
        }
        .product-img {
            width: 100px;
            height: auto;
            border-radius: 5px;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <h1>AI Product Chatbot</h1>
    <div id="chat-box"></div>
    <input type="text" id="user-input" placeholder="Ask about products...">
    <button onclick="sendMessage()">Send</button>

    <script>
        async function sendMessage() {
            const userInput = document.getElementById("user-input").value.trim();
            if (userInput === "") return;

            displayMessage("You", userInput, "user-message");
            addLoading();

            try {
                const response = await fetch("http://127.0.0.1:8000/chatbot/", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: userInput })
                });

                const data = await response.json();
                removeLoading();
                displayMessage("Chatbot", formatResponse(data.response), "bot-message");
            } catch (error) {
                removeLoading();
                displayMessage("Chatbot", "Error fetching response. Try again!", "bot-message");
                console.error("Error:", error);
            }

            document.getElementById("user-input").value = "";
        }

        function displayMessage(sender, message, className) {
            const messageElement = document.createElement("p");
            messageElement.className = className;
            messageElement.innerHTML = `<strong>${sender}:</strong> ${message}`;
            document.getElementById("chat-box").appendChild(messageElement);
            document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
        }

        function formatResponse(response) {
            if (!response) {
                return "No results found.";
            }

            if (response.Comparison) {
                return `Comparing: ${response.Comparison.join(" vs ")}<br><br>` +
                response.Details.map(p => 
                    `<strong>${p.name}</strong><br>Price: $${p.price}<br>Stock: ${p.stock}<br>
                    Category: ${p.category}<br>
                    ${p.images.length > 0 ? `<img src="${p.images[0]}" class="product-img">` : "No image available"}<br><br>`
                ).join("");
            } else {
                return JSON.stringify(response, null, 2);
            }
        }

        function addLoading() {
            const loadingElement = document.createElement("p");
            loadingElement.className = "loading";
            loadingElement.id = "loading";
            loadingElement.innerHTML = "Chatbot is typing...";
            document.getElementById("chat-box").appendChild(loadingElement);
            document.getElementById("chat-box").scrollTop = document.getElementById("chat-box").scrollHeight;
        }

        function removeLoading() {
            const loadingElement = document.getElementById("loading");
            if (loadingElement) {
                loadingElement.remove();
            }
        }
    </script>
</body>
</html>
